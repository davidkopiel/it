name: "Frogbot Scan Pull Request"
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  pull-requests: write
  contents: read
  security-events: write
  id-token: write
jobs:
  scan-pull-request:
    runs-on: [self-hosted, local, project-it]
    environment: frogbot
    steps:
      - uses: jfrog/frogbot@v3
        env:
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_URL: ${{ vars.JF_URL }}
        with:
          oidc-provider-name: davidko-davidkopiel
          oidc-audience: https://github.com/davidkopiel
